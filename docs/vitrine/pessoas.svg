<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470"><style>
    text { font-family: 'Segoe UI Variable Display','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif; }
    .a { transform-box: fill-box; transform-origin: center; }
    @keyframes deriva1 { 50% { transform: translate(60px, -30px) scale(1.12); } }
    @keyframes deriva2 { 50% { transform: translate(-70px, 40px) scale(.92); } }
