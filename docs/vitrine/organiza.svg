      <rect width="1200" height="470" rx="28" fill="none" stroke="#ffffff" stroke-opacity=".08" stroke-width="2"/>
    </g><text x="650" y="120" font-size="17" font-weight="700" letter-spacing="2.2" fill="#2d7efc">ORGANIZAÇÃO</text><text x="650" y="176" font-size="44" font-weight="700" letter-spacing="-1.2" fill="#f5f5f4">Linha do tempo, mapa</text><text x="650" y="228" font-size="44" font-weight="700" letter-spacing="-1.2" fill="#f5f5f4">e álbuns prontos.</text><text x="650" y="298" font-size="22" fill="#a3a6ab">Os álbuns se montam sozinhos por</text><text x="650" y="331" font-size="22" fill="#a3a6ab">dia e lugar. E ainda tem duplicados</text><text x="650" y="364" font-size="22" fill="#a3a6ab">para liberar espaço e as fotos</text><text x="650" y="397" font-size="22" fill="#a3a6ab">borradas separadas para revisar.</text><rect x="80" y="50" width="250" height="360" rx="18" fill="#1c1c22" stroke="#fff" stroke-opacity=".12"/><text x="100" y="86" font-size="17" font-weight="600" fill="#f5f5f4">Linha do tempo</text><rect class="cresce" style="animation-delay: 0.00s" x="100" y="310" width="18" height="60" rx="5" fill="#3a3a50"/><rect class="cresce" style="animation-delay: 0.08s" x="127" y="280" width="18" height="90" rx="5" fill="#3a3a50"/><rect class="cresce" style="animation-delay: 0.16s" x="154" y="240" width="18" height="130" rx="5" fill="#3a3a50"/><rect class="cresce" style="animation-delay: 0.24s" x="181" y="290" width="18" height="80" rx="5" fill="#3a3a50"/><rect class="cresce" style="animation-delay: 0.32s" x="208" y="200" width="18" height="170" rx="5" fill="#3a3a50"/><rect class="cresce" style="animation-delay: 0.40s" x="235" y="160" width="18" height="210" rx="5" fill="#3a3a50"/><rect class="cresce" style="animation-delay: 0.48s" x="262" y="220" width="18" height="150" rx="5" fill="#3a3a50"/><rect class="cresce" style="animation-delay: 0.56s" x="289" y="130" width="18" height="240" rx="5" fill="#2d7efc"/><text x="100" y="395" font-size="13" fill="#a3a6ab">2017</text><text x="310" y="395" text-anchor="end" font-size="13" fill="#a3a6ab">2025</text><rect x="350" y="50" width="230" height="360" rx="18" fill="#132a1f"/><clipPath id="mapa"><rect x="350" y="50" width="230" height="360" rx="18"/></clipPath><g clip-path="url(#mapa)"><path d="M330 170 Q430 120 480 200 T610 230" stroke="#1e88e5" stroke-width="18" fill="none" opacity=".6"/><path d="M350 300 L580 260 M410 50 L470 410 M520 50 L540 410" stroke="#2e4d3c" stroke-width="5"/><path d="M380 330 Q440 300 490 360 T590 340 V420 H350Z" fill="#1b3a2a"/></g><g class="pino" style="animation-delay: 0.30s"><path d="M410 150 c-18 -20 -18 -44 0 -44 s18 24 0 44Z" fill="#ff453a"/><circle cx="410" cy="120" r="5" fill="#fff"/></g><g class="pino" style="animation-delay: 0.55s"><path d="M500 200 c-18 -20 -18 -44 0 -44 s18 24 0 44Z" fill="#2d7efc"/><circle cx="500" cy="170" r="5" fill="#fff"/></g><g class="pino" style="animation-delay: 0.80s"><path d="M445 290 c-18 -20 -18 -44 0 -44 s18 24 0 44Z" fill="#ffd60a"/><circle cx="445" cy="260" r="5" fill="#fff"/></g><g class="pino" style="animation-delay: 1.05s"><path d="M525 350 c-18 -20 -18 -44 0 -44 s18 24 0 44Z" fill="#30d158"/><circle cx="525" cy="320" r="5" fill="#fff"/></g></svg>
