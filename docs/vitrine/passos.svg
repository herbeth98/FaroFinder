<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330"><style>
    text { font-family: 'Segoe UI Variable Display','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif; }
    .a { transform-box: fill-box; transform-origin: center; }
    @keyframes deriva1 { 50% { transform: translate(60px, -30px) scale(1.12); } }
    @keyframes deriva2 { 50% { transform: translate(-70px, 40px) scale(.92); } }
    @keyframes deriva3 { 50% { transform: translate(40px, 50px) scale(1.08); } }
    .b1 { animation: deriva1 18s ease-in-out infinite; }
    .b2 { animation: deriva2 22s ease-in-out infinite; }
    .b3 { animation: deriva3 26s ease-in-out infinite; }
    
    @keyframes vai { 0% { stroke-dashoffset: 40; } 100% { stroke-dashoffset: 0; } }
    .liga { stroke-dasharray: 6 14; animation: vai 1.2s linear infinite; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; }  }</style>
    <defs>
      <linearGradient id="f1200x330" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070a14"/><stop offset="1" stop-color="#0c1630"/></linearGradient>
      <filter id="nevf1200x330" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="70"/></filter>
      <clipPath id="cf1200x330"><rect width="1200" height="330" rx="28"/></clipPath>
    </defs>
    <g clip-path="url(#cf1200x330)">
      <rect width="1200" height="330" fill="url(#f1200x330)"/>
      <g filter="url(#nevf1200x330)" opacity="0.25">
        <circle class="a b1" cx="180.0" cy="66.0" r="138.6" fill="#0a84ff"/>
        <circle class="a b2" cx="1020.0" cy="82.5" r="118.8" fill="#5e5ce6"/>
        <circle class="a b3" cx="720.0" cy="313.5" r="132.0" fill="#64d2ff" opacity=".7"/>
      </g>
      <rect width="1200" height="330" rx="28" fill="none" stroke="#ffffff" stroke-opacity=".08" stroke-width="2"/>
    </g><circle cx="200" cy="110" r="44" fill="#0a84ff" fill-opacity=".16" stroke="#0a84ff" stroke-width="2.5"/><text x="200" y="125" text-anchor="middle" font-size="40" font-weight="700" fill="#f5f5f7">1</text><text x="200" y="200" text-anchor="middle" font-size="26" font-weight="700" fill="#f5f5f7">Baixe o instalador</text><text x="200" y="238" text-anchor="middle" font-size="19" fill="#a1a1aa">Um arquivo só, de 3 MB,</text><text x="200" y="266" text-anchor="middle" font-size="19" fill="#a1a1aa">na página de versões.</text><path class="liga" d="M270 110 H530" stroke="#0a84ff" stroke-width="3" stroke-linecap="round" fill="none"/><circle cx="600" cy="110" r="44" fill="#0a84ff" fill-opacity=".16" stroke="#0a84ff" stroke-width="2.5"/><text x="600" y="125" text-anchor="middle" font-size="40" font-weight="700" fill="#f5f5f7">2</text><text x="600" y="200" text-anchor="middle" font-size="26" font-weight="700" fill="#f5f5f7">Instale e espere</text><text x="600" y="238" text-anchor="middle" font-size="19" fill="#a1a1aa">Ele prepara a IA sozinho:</text><text x="600" y="266" text-anchor="middle" font-size="19" fill="#a1a1aa">de 10 a 40 minutos.</text><path class="liga" d="M670 110 H930" stroke="#0a84ff" stroke-width="3" stroke-linecap="round" fill="none"/><circle cx="1000" cy="110" r="44" fill="#0a84ff" fill-opacity=".16" stroke="#0a84ff" stroke-width="2.5"/><text x="1000" y="125" text-anchor="middle" font-size="40" font-weight="700" fill="#f5f5f7">3</text><text x="1000" y="200" text-anchor="middle" font-size="26" font-weight="700" fill="#f5f5f7">Indexe e busque</text><text x="1000" y="238" text-anchor="middle" font-size="19" fill="#a1a1aa">Escolha os discos e</text><text x="1000" y="266" text-anchor="middle" font-size="19" fill="#a1a1aa">escreva o que procura.</text></svg>
