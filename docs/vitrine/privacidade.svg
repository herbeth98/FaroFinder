    </g><circle class="anel" style="animation-delay: 0.0s" cx="600.0" cy="130" r="56" fill="none" stroke="#30d158" stroke-width="2"/><circle class="anel" style="animation-delay: 1.2s" cx="600.0" cy="130" r="56" fill="none" stroke="#30d158" stroke-width="2"/><circle class="anel" style="animation-delay: 2.4s" cx="600.0" cy="130" r="56" fill="none" stroke="#30d158" stroke-width="2"/><circle cx="600.0" cy="130" r="56" fill="#30d158" fill-opacity=".14" stroke="#30d158" stroke-width="2"/><rect x="578.0" y="124" width="44" height="36" rx="8" fill="#30d158"/><path d="M587.0 124 v-10 a13 13 0 0 1 26 0 v10" fill="none" stroke="#30d158" stroke-width="6"/><text x="600.0" y="268" text-anchor="middle" font-size="46" font-weight="700" letter-spacing="-1.2" fill="#f5f5f7">Nada sai do seu computador.</text><text x="600.0" y="316" text-anchor="middle" font-size="22" fill="#a1a1aa">A inteligência artificial roda na sua máquina. Sem conta, sem assinatura</text><text x="600.0" y="348" text-anchor="middle" font-size="22" fill="#a1a1aa">e sem mandar nenhuma foto para a nuvem.</text></svg>
